name: orchestrai

# Every value has a default, so a fresh clone runs with no .env (`make demo`).
# Ports: POSTGRES_PORT (5432), API_PORT (8000), WEB_PORT (8080).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrai}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../apps/api
    image: orchestrai-api:local
    restart: unless-stopped
    environment:
      # Inside the compose network the database is `db:5432`, whatever POSTGRES_PORT is.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-orchestrai}:${POSTGRES_PASSWORD:-orchestrai}@db:5432/${POSTGRES_DB:-orchestrai}
      # fixture replays recorded LLM replies: no API key needed.
      LLM_MODE: ${LLM_MODE:-fixture}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-8080},http://localhost:5173}
      SIM_SEED: ${SIM_SEED:-42}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s  # alembic upgrade runs before uvicorn starts

  web:
    build:
      context: ../apps/web
    image: orchestrai-web:local
    restart: unless-stopped
    environment:
      # The URL the *browser* uses to reach the API (not a container-network name).
      API_URL: ${PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  db-data:
