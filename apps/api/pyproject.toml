[project]
name = "orchestrai-api"
version = "0.1.0"
description = "OrchestrAI backend: FastAPI service, SPM engines and LangGraph workflows."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "google-genai>=3.0.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "numpy>=2.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.16.2",
    "scipy>=1.15",
    "sqlalchemy>=2",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Autogenerated revisions may contain long SQL literals the formatter cannot wrap.
"migrations/versions/*.py" = ["E501"]
# The demo task table is easier to tune with one aligned row per task.
"app/seed.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
