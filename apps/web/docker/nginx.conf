# Static SPA server for the OrchestrAI web build (nginx-unprivileged listens on 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Written at container start from API_URL (docker/40-runtime-config.sh); never cache it.
    location = /config.js {
        alias /tmp/orchestrai/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes (/projects/1, ...) all serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
